version: '3.8'

services:
  discord-bot:
    build:
      context: .
      tags:
        - gravekeeper_bot:latest
    container_name: gravekeeper-bot
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./files:/app/files:ro
      - ./data:/app/data
    environment:
      - TZ=Europe/Moscow

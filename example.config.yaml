bot_token: "xxxxx"
guild_id: "xxxxx"
monitored_channels:
  - "xxxxx"

mute_role_id: "xxxxx"
mute_duration: "5m"
ignore_replies: true
state_file_path: "./data/mutes.json" # Файл будет в отдельной папке для Docker Volumes

patterns:
  # - "(?i)\\bdead\\s*chat\\b"
  # - "(?i)\\bдед\\s*чат\\b"
  # - "(?i)dead-chat"
  # # dead chat
  - '(?i)[dд]+[^a-zа-я0-9ё]*[eе3]+[^a-zа-я0-9ё]*[aа@]+[^a-zа-я0-9ё]*[dд]+[^a-zа-я0-9ё]*[cс]+[^a-zа-я0-9ё]*[hхн]+[^a-zа-я0-9ё]*[aа@]+[^a-zа-я0-9ё]*[tт7]+'
  # # chat is dead
  - '(?i)[cс]+[^a-zа-я0-9ё]*[hхн]+[^a-zа-я0-9ё]*[aа@]+[^a-zа-я0-9ё]*[tт7]+[^a-zа-я0-9ё]*[i1!и]+[^a-zа-я0-9ё]*[sс$5]+[^a-zа-я0-9ё]*[dд]+[^a-zа-я0-9ё]*[eе3]+[^a-zа-я0-9ё]*[aа@]+[^a-zа-я0-9ё]*[dд]+'
  # # дед чат
  - '(?i)[дd]+[^a-zа-я0-9ё]*[еeё3]+[^a-zа-я0-9ё]*[дd]+[^a-zа-я0-9ё]*[ч4]+[^a-zа-я0-9ё]*[аa@]+[^a-zа-я0-9ё]*[тt7]+'
  # # мертвый чат
  - '(?i)[дd]+[^a-zа-я0-9ё]*[эeе3]+[^a-zа-я0-9ё]*[дd]+[^a-zа-я0-9ё]*[ч4]+[^a-zа-я0-9ё]*[аa@]+[^a-zа-я0-9ё]*[тt7]+'
  # # дэд чат
  - '(?i)[мm]+[^a-zа-я0-9ё]*[еeё3]+[^a-zа-я0-9ё]*[рp]+[^a-zа-я0-9ё]*[тt7]+[^a-zа-я0-9ё]*[вb8]+[^a-zа-я0-9ё]*(?:ы|[bь][i1!]|[yиi])+[с-яa-z0-9ё]*?[ч4]+[^a-zа-я0-9ё]*[аa@]+[^a-zа-я0-9ё]*[тt7]+'
  # # 1984
  - '(?i)[1i!l|]+[^a-zа-я0-9ё]*[9g]+[^a-zа-я0-9ё]*[8bв]+[^a-zа-я0-9ё]*[4ч]+'
  # # заебалась
  - '(?i)[з3z]+[^a-zа-я0-9ё]*[аa@]+[^a-zа-я0-9ё]*[еeё3]+[^a-zа-я0-9ё]*[б6b]+[^a-zа-я0-9ё]*[аa@]+[^a-zа-я0-9ё]*[лl]+[^a-zа-я0-9ё]*[аa@]+[^a-zа-я0-9ё]*[сcs$]+(?:[^a-zа-я0-9ё]*[ьb])?'
  # # гфика с "Молимся за тишину чата"
  - '(?i)[kк]+[^a-zа-я0-9ё]*[rрp]+[^a-zа-я0-9ё]*[eеё3]+[^a-zа-я0-9ё]*[sсc$5]+[^a-zа-я0-9ё]*[tт7]+[^a-zа-я0-9ё]*[oо0]+[^a-zа-я0-9ё]*[nн]+[^a-zа-я0-9ё]*[oо0]+[^a-zа-я0-9ё]*[sсc$5]+[^a-zа-я0-9ё]*[cсц]+[^a-zа-я0-9ё]*[yуыi1]+[^a-zа-я0-9ё]*[mм]+[^a-zа-я0-9ё]*[oо0]+[^a-zа-я0-9ё]*[lл1]+[^a-zа-я0-9ё]*[iи1!]+[^a-zа-я0-9ё]*[tт7]+[^a-zа-я0-9ё]*[vвb8]+[^a-zа-я0-9ё]*[aа@]+'

# Массив ответов (Отправляются сверху вниз с задержкой 700мс)
responses:
  # - type: "text"
  #   content: "КАКОГО ДЬЯВОЛА ТЫ ЗДЕСЬ ШУМИШЬ???"

  - type: "voice"
    path: "./files/audio.ogg"
    duration: 3


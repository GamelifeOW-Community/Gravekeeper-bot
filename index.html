<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DeadChat Bot Dashboard</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c2f33; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #23272a; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1, h2, h3 { border-bottom: 1px solid #7289da; padding-bottom: 10px; }
        input, select, textarea { width: 100%; padding: 8px; margin-bottom: 10px; background: #2c2f33; border: 1px solid #7289da; color: white; border-radius: 4px; box-sizing: border-box; }
        button { background: #7289da; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #5b6eae; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        .pattern-card { background: #2c2f33; padding: 15px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #444; }
        .response-card { background: #23272a; padding: 10px; border-left: 3px solid #7289da; margin-bottom: 10px; border-radius: 4px; }
        .danger { background: #ed4245; }
        .danger:hover { background: #c53030; }
        .action-btn { padding: 8px 12px; font-size: 1.1em; }
        .login-box { max-width: 400px; margin: 100px auto; text-align: center; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; width: auto; }
        .checkbox-label input { width: auto; margin: 0; }
    </style>
</head>
<body>
<div id="app" class="container">
    
    <div v-if="!isLoggedIn" class="login-box">
        <h2>Вход в панель управления</h2>
        <form @submit.prevent="login">
            <input v-model="username" type="text" placeholder="Логин" required>
            <input v-model="password" type="password" placeholder="Пароль" required>
            <button type="submit" style="width:100%">Войти</button>
        </form>
    </div>

    <div v-else>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Настройки Бота</h1>
            <div>
                <button @click="exportConfig" style="margin-right:10px; background:#43b581;">📥 Экспорт</button>
                <button @click="logout" class="danger">Выйти</button>
            </div>
        </div>

        <div v-if="config">
            <h2>Глобальные настройки</h2>
            <div class="row">
                <div><label>Mute Role ID</label><input v-model="config.mute_role_id" type="text"></div>
                <div><label>Дефолтное время мута</label><input v-model="config.mute_duration" type="text"></div>
            </div>
            <label class="checkbox-label"><input type="checkbox" v-model="config.ignore_replies"> Игнорировать реплаи</label>

            <!-- Глобальные ответы -->
            <div style="margin-top: 15px;">
                <label><b>Дефолтные ответы (срабатывают, если у паттерна нет своих)</b></label>
                <div v-for="(r, j) in config.responses" :key="j" class="response-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <select v-model="r.type" style="width: 200px; margin: 0;">
                            <option value="text">Текст</option>
                            <option value="gif">GIF</option>
                            <option value="voice">Голосовое (OGG)</option>
                        </select>
                        <button @click="config.responses.splice(j, 1)" class="danger" style="padding: 5px 10px;">✕ Удалить</button>
                    </div>
                    <textarea v-if="r.type === 'text'" v-model="r.content" rows="2" placeholder="Текст сообщения..."></textarea>
                    <input v-if="r.type === 'gif'" v-model="r.url" type="text" placeholder="Ссылка на GIF (Tenor и тд)">
                    <div v-if="r.type === 'voice'" class="row">
                        <div style="flex: 2;">
                            <label>Путь к OGG файлу</label>
                            <div style="display: flex; gap: 5px;">
                                <input v-model="r.path" type="text" placeholder="data/audio/file.ogg" style="margin: 0;">
                                <input type="file" @change="uploadAudio($event, r)" accept=".ogg" style="width: 200px;">
                            </div>
                        </div>
                        <div style="flex: 1;"><label>Длительность (сек)</label><input v-model.number="r.duration" type="number" step="0.1"></div>
                    </div>
                </div>
                <button @click="addResponse(config.responses)" style="padding: 5px 10px; font-size: 0.9em;">+ Добавить дефолтный ответ</button>
            </div>

            <!-- Анти-Спам -->
            <h2>Анти-Спам (Защита от доебов)</h2>
            <div class="pattern-card">
                <label class="checkbox-label"><input type="checkbox" v-model="config.anti_spam.enabled"> Включить Анти-Спам</label>
                <div v-if="config.anti_spam.enabled">
                    <div class="row">
                        <div><label>Мин. тегов</label><input v-model.number="config.anti_spam.threshold_min" type="number"></div>
                        <div><label>Макс. тегов</label><input v-model.number="config.anti_spam.threshold_max" type="number"></div>
                        <div><label>Сброс таймера</label><input v-model="config.anti_spam.reset_time" type="text"></div>
                        <div><label>Время мута</label><input v-model="config.anti_spam.mute_duration" type="text"></div>
                    </div>
                    <label style="margin-top: 10px;"><b>Ответы при муте за спам:</b></label>
                    <div v-for="(r, j) in config.anti_spam.responses" :key="j" class="response-card">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                            <select v-model="r.type" style="width: 200px; margin: 0;">
                                <option value="text">Текст</option>
                                <option value="gif">GIF</option>
                                <option value="voice">Голосовое (OGG)</option>
                            </select>
                            <button @click="config.anti_spam.responses.splice(j, 1)" class="danger" style="padding: 5px 10px;">✕ Удалить</button>
                        </div>
                        <textarea v-if="r.type === 'text'" v-model="r.content" rows="2"></textarea>
                        <input v-if="r.type === 'gif'" v-model="r.url" type="text" placeholder="Ссылка на GIF">
                        <div v-if="r.type === 'voice'" class="row">
                            <div style="flex: 2;">
                                <div style="display: flex; gap: 5px;">
                                    <input v-model="r.path" type="text" style="margin: 0;">
                                    <input type="file" @change="uploadAudio($event, r)" accept=".ogg" style="width: 200px;">
                                </div>
                            </div>
                            <div style="flex: 1;"><input v-model.number="r.duration" type="number" step="0.1" placeholder="Сек."></div>
                        </div>
                    </div>
                    <button @click="addResponse(config.anti_spam.responses)" style="padding: 5px 10px; font-size: 0.9em;">+ Добавить ответ</button>
                </div>
            </div>

            <!-- Паттерны -->
            <h2>Паттерны ({{ config.patterns.length }})</h2>
            <button @click="addPattern" style="margin-bottom: 15px;">+ Добавить паттерн</button>
            
            <div v-for="(p, i) in config.patterns" :key="i" class="pattern-card">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <label class="checkbox-label" style="margin: 0;"><input type="checkbox" v-model="p.enabled"> <b>Включен</b></label>
                    <div style="display: flex; gap: 5px;">
                        <button @click="moveUp(i)" :disabled="i === 0" class="action-btn">⬆️</button>
                        <button @click="moveDown(i)" :disabled="i === config.patterns.length - 1" class="action-btn">⬇️</button>
                        <button @click="removePattern(i)" class="danger" style="margin-left: 10px;">Удалить</button>
                    </div>
                </div>
                
                <div class="row">
                    <div style="flex: 1;"><label>Описание</label><input v-model="p.description" type="text" placeholder="Например: Правило для 'Бот сосал'"></div>
                    <div style="flex: 2;"><label>Регулярное выражение</label><input v-model="p.pattern" type="text" placeholder="(?i)бот сосал"></div>
                </div>

                <div class="row">
                    <div><label>Шанс реакции (0.0-1.0)</label><input v-model.number="p.react_chance" type="number" step="0.1" min="0" max="1"></div>
                    <div><label>Свое время мута</label><input v-model="p.mute_duration" type="text" placeholder="Например: 10m"></div>
                    <div style="display: flex; align-items: center;">
                        <label class="checkbox-label" style="margin-top: 15px;"><input type="checkbox" v-model="p.disable_mute"> Отключить мут</label>
                    </div>
                </div>

                <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">
                    <label><b>Кастомные ответы для этого паттерна (Если пусто — используются дефолтные)</b></label>
                    <div v-for="(r, j) in p.responses" :key="j" class="response-card">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                            <select v-model="r.type" style="width: 200px; margin: 0;">
                                <option value="text">Текст</option>
                                <option value="gif">GIF</option>
                                <option value="voice">Голосовое (OGG)</option>
                            </select>
                            <button @click="p.responses.splice(j, 1)" class="danger" style="padding: 5px 10px;">✕ Удалить</button>
                        </div>
                        <textarea v-if="r.type === 'text'" v-model="r.content" rows="2"></textarea>
                        <input v-if="r.type === 'gif'" v-model="r.url" type="text" placeholder="Ссылка на GIF">
                        <div v-if="r.type === 'voice'" class="row">
                            <div style="flex: 2;">
                                <label>Путь к OGG</label>
                                <div style="display: flex; gap: 5px;">
                                    <input v-model="r.path" type="text" style="margin: 0;">
                                    <input type="file" @change="uploadAudio($event, r)" accept=".ogg" style="width: 200px;">
                                </div>
                            </div>
                            <div style="flex: 1;"><label>Сек.</label><input v-model.number="r.duration" type="number" step="0.1"></div>
                        </div>
                    </div>
                    <button @click="addResponse(p.responses)" style="padding: 5px 10px; font-size: 0.9em;">+ Добавить ответ</button>
                </div>
            </div>

            <button @click="saveConfig" style="width: 100%; font-size: 1.2em; margin-top: 20px; padding: 15px;">💾 СОХРАНИТЬ И ПРИМЕНИТЬ</button>
        </div>
    </div>
</div>

<script>
const { createApp } = Vue;

createApp({
    data() {
        return {
            isLoggedIn: document.cookie.includes('session_token'),
            username: '', password: '',
            config: null
        }
    },
    mounted() { if (this.isLoggedIn) this.loadConfig(); },
    methods: {
        async login() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: this.username, password: this.password})
            });
            if (res.ok) { this.isLoggedIn = true; this.loadConfig(); }
            else { alert('Неверный логин или пароль'); }
        },
        async logout() {
            await fetch('/api/logout', {method: 'POST'});
            this.isLoggedIn = false;
        },
        async loadConfig() {
            const res = await fetch('/api/config');
            if (res.status === 401) { this.isLoggedIn = false; return; }
            this.config = await res.json();
            if(!this.config.patterns) this.config.patterns = [];
            if(!this.config.responses) this.config.responses = [];
            if(!this.config.anti_spam.responses) this.config.anti_spam.responses = [];
            this.config.patterns.forEach(p => { if(!p.responses) p.responses = []; });
        },
        async saveConfig() {
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(this.config)
            });
            if (res.ok) { alert('Конфигурация успешно применена!'); }
            else { alert('Ошибка сохранения'); }
        },
        exportConfig() { window.open('/api/config/export', '_blank'); },
        addPattern() {
            this.config.patterns.unshift({
                description: "", pattern: "(?i)новое_слово", enabled: true, disable_mute: false, react_chance: 1.0, responses: []
            });
        },
        removePattern(idx) {
            if(confirm('Точно удалить этот паттерн?')) this.config.patterns.splice(idx, 1);
        },
        moveUp(idx) {
            if (idx > 0) this.config.patterns.splice(idx - 1, 0, this.config.patterns.splice(idx, 1)[0]);
        },
        moveDown(idx) {
            if (idx < this.config.patterns.length - 1) this.config.patterns.splice(idx + 1, 0, this.config.patterns.splice(idx, 1)[0]);
        },
        addResponse(responsesArray) {
            responsesArray.push({ type: 'text', content: '' });
        },
        async uploadAudio(event, responseObj) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.name.endsWith('.ogg')) {
                alert('Неверный формат! Загрузите файл .ogg с кодеком Opus.');
                event.target.value = ""; // Сбрасываем инпут
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            const res = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                const data = await res.json();
                responseObj.path = "./" + data.path; // Сервер вернет путь data/audio/file.ogg
                alert('Аудиофайл успешно загружен!');
            } else {
                alert('Ошибка при загрузке файла.');
            }
        }
    }
}).mount('#app')
</script>
</body>
</html>

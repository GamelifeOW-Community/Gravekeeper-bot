<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DeadChat Bot Dashboard</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c2f33; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #23272a; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1, h2 { border-bottom: 1px solid #7289da; padding-bottom: 10px; }
        input, select, textarea { width: 100%; padding: 8px; margin-bottom: 10px; background: #2c2f33; border: 1px solid #7289da; color: white; border-radius: 4px; box-sizing: border-box; }
        button { background: #7289da; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #5b6eae; }
        .pattern-card { background: #2c2f33; padding: 15px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #444; }
        .danger { background: #ed4245; }
        .danger:hover { background: #c53030; }
        .login-box { max-width: 400px; margin: 100px auto; text-align: center; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; width: auto; }
        .checkbox-label input { width: auto; margin: 0; }
    </style>
</head>
<body>
<div id="app" class="container">
    
    <!-- Форма Логина -->
    <div v-if="!isLoggedIn" class="login-box">
        <h2>Вход в панель управления</h2>
        <form @submit.prevent="login">
            <input v-model="username" type="text" placeholder="Логин" required>
            <input v-model="password" type="password" placeholder="Пароль" required>
            <button type="submit" style="width:100%">Войти</button>
        </form>
    </div>

    <!-- Дашборд -->
    <div v-else>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Настройки Бота</h1>
            <div>
                <button @click="exportConfig" style="margin-right:10px; background:#43b581;">📥 Экспорт Конфига</button>
                <button @click="logout" class="danger">Выйти</button>
            </div>
        </div>

        <div v-if="config">
            <h2>Глобальные настройки</h2>
            <div class="row">
                <div>
                    <label>Mute Role ID</label>
                    <input v-model="config.mute_role_id" type="text">
                </div>
                <div>
                    <label>Дефолтное время мута (например: 5m, 1h)</label>
                    <input v-model="config.mute_duration" type="text">
                </div>
            </div>
            <label class="checkbox-label">
                <input type="checkbox" v-model="config.ignore_replies"> Игнорировать реплаи
            </label>

            <h2>Анти-Спам (Доебы)</h2>
            <div class="pattern-card">
                <label class="checkbox-label">
                    <input type="checkbox" v-model="config.anti_spam.enabled"> Включить Анти-Спам
                </label>
                <div class="row" v-if="config.anti_spam.enabled">
                    <div><label>Мин. тегов</label><input v-model.number="config.anti_spam.threshold_min" type="number"></div>
                    <div><label>Макс. тегов</label><input v-model.number="config.anti_spam.threshold_max" type="number"></div>
                    <div><label>Сброс таймера</label><input v-model="config.anti_spam.reset_time" type="text"></div>
                    <div><label>Время мута</label><input v-model="config.anti_spam.mute_duration" type="text"></div>
                </div>
            </div>

            <h2>Паттерны ({{ config.patterns.length }})</h2>
            <button @click="addPattern" style="margin-bottom: 15px;">+ Добавить паттерн</button>
            
            <div v-for="(p, i) in config.patterns" :key="i" class="pattern-card">
                <div style="display: flex; justify-content: space-between;">
                    <label class="checkbox-label">
                        <input type="checkbox" v-model="p.enabled"> <b>Включен</b>
                    </label>
                    <button @click="removePattern(i)" class="danger">Удалить</button>
                </div>
                
                <label>Регулярное выражение (Pattern)</label>
                <input v-model="p.pattern" type="text">

                <div class="row">
                    <div>
                        <label>Шанс реакции (0.0 - 1.0)</label>
                        <input v-model.number="p.react_chance" type="number" step="0.1" min="0" max="1">
                    </div>
                    <div>
                        <label>Время мута (оставь пустым для дефолта)</label>
                        <input v-model="p.mute_duration" type="text">
                    </div>
                    <div style="display: flex; align-items: center;">
                        <label class="checkbox-label">
                            <input type="checkbox" v-model="p.disable_mute"> Отключить мут (Только ответ)
                        </label>
                    </div>
                </div>
            </div>

            <button @click="saveConfig" style="width: 100%; font-size: 1.2em; margin-top: 20px;">💾 СОХРАНИТЬ И ПРИМЕНИТЬ</button>
        </div>
    </div>
</div>

<script>
const { createApp } = Vue;

createApp({
    data() {
        return {
            isLoggedIn: document.cookie.includes('session_token'),
            username: '', password: '',
            config: null
        }
    },
    mounted() { if (this.isLoggedIn) this.loadConfig(); },
    methods: {
        async login() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: this.username, password: this.password})
            });
            if (res.ok) { this.isLoggedIn = true; this.loadConfig(); }
            else { alert('Неверный логин или пароль'); }
        },
        async logout() {
            await fetch('/api/logout', {method: 'POST'});
            this.isLoggedIn = false;
        },
        async loadConfig() {
            const res = await fetch('/api/config');
            if (res.status === 401) { this.isLoggedIn = false; return; }
            this.config = await res.json();
            // Нормализация данных, если чего-то нет
            if(!this.config.patterns) this.config.patterns = [];
        },
        async saveConfig() {
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(this.config)
            });
            if (res.ok) { alert('Конфигурация успешно применена!'); }
            else { alert('Ошибка сохранения'); }
        },
        exportConfig() {
            window.open('/api/config/export', '_blank');
        },
        addPattern() {
            this.config.patterns.unshift({
                pattern: "(?i)новое_слово", enabled: true, disable_mute: false, react_chance: 1.0, responses: []
            });
        },
        removePattern(idx) {
            this.config.patterns.splice(idx, 1);
        }
    }
}).mount('#app')
</script>
</body>
</html>
